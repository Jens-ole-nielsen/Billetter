name: Tests

on:
  push:
  pull_request:

jobs:
  pure-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, mbstring
      - name: Token, capacity, Stripe signature, QR and PDF
        run: php forsamlingshus-billetter/tests/run.php
